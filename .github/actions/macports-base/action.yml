name: MacPorts base
description: >-
  Install the MacPorts base on Intel macOS, caching the official .pkg download. What is
  cached is the package, not an installed tree: the installer also creates the 'macports'
  system user, so an /opt/local snapshot restore leaves files owned by a user that does
  not exist and 'port sync' dies with "Unknown user given" as soon as it drops privileges.

outputs:
  version:
    description: MacPorts base version that ended up installed
    value: ${{ steps.resolve.outputs.version }}
  url:
    description: Download URL of the MacPorts .pkg this run resolved
    value: ${{ steps.resolve.outputs.url }}

runs:
  using: composite
  steps:
    - name: Resolve the latest MacPorts release
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://api.github.com/repos/macports/macports-base/releases/latest \
          -o "$RUNNER_TEMP/macports-release.json"
        major="$(sw_vers -productVersion | cut -d. -f1)"
        # No jq on the Intel image, and no Homebrew (it no longer supports Intel macOS).
        url="$(python3 - "$RUNNER_TEMP/macports-release.json" "$major" <<'PY'
        import json, sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            release = json.load(handle)
        packages = [a["browser_download_url"] for a in release["assets"]
                    if a["name"].endswith(".pkg")]
        matching = [u for u in packages if f"-{sys.argv[2]}-" in u]
        candidates = matching or packages
        print(candidates[0] if candidates else "")
        PY
        )"
        [ -n "$url" ] || { echo "::error::no MacPorts .pkg asset in the latest release"; exit 1; }
        version="$(python3 - "$RUNNER_TEMP/macports-release.json" <<'PY'
        import json, sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            print(json.load(handle)["tag_name"].lstrip("v"))
        PY
        )"
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "osmajor=$major" >> "$GITHUB_OUTPUT"
        echo "MacPorts base $version from $url"

    - name: Restore the cached package
      id: restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/macports.pkg
        # Exact key on purpose: macOS major is in it because a package built for another
        # OS major is not a safe install, and there is no restore-keys fallback because a
        # partial hit would leave an older package on disk and it would then be saved
        # under the new version's key - the key would claim a version the file is not.
        key: macports-pkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.osmajor }}-${{ steps.resolve.outputs.version }}

    - name: Install the base
      shell: bash
      run: |
        set -euo pipefail
        trap 'rc=$?; echo "::error::failed at line $LINENO (exit $rc): $BASH_COMMAND"' ERR
        pkg="$RUNNER_TEMP/macports.pkg"
        if [ -s "$pkg" ]; then
          echo "installing MacPorts base from the cached package"
        else
          echo "downloading MacPorts base package"
          curl -fsSL -o "$pkg" "${{ steps.resolve.outputs.url }}"
        fi
        # Always install rather than unpack a saved tree: the installer creates the
        # 'macports' user (uid 502, group 501) that 'port' drops privileges to.
        sudo installer -pkg "$pkg" -target /
        [ -x /opt/local/bin/port ] || { echo "::error::MacPorts base is not usable"; exit 1; }
        port version

    - name: Save the package
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/macports.pkg
        key: ${{ steps.restore.outputs.cache-primary-key }}
