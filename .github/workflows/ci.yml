name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"     # weekly: the full from-source port build and tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# macos-15-intel is the last x86_64 runner image GitHub offers (until August 2027).
# There is no arm64 job: on Apple Silicon this repository does not apply, and
# scripts/install.sh and tests/run_tests.sh abort there by design.
#
# Action versions: GitHub removed the Node 20 runtime from hosted runners on
# 2026-09-23, so every JavaScript action must declare node24. checkout@v5+ and
# upload-artifact@v6+ are the first Node 24 majors for each (v4 for either fails on
# the runner with "Node 20 is not supported"). Keep this in mind when bumping.
#
# PATH: the MacPorts .pkg adds /opt/local/bin to /etc/paths.d, which only affects
# shells started after the install. Each step's shell is already running, so without
# the explicit PATH below the very next `port` call exits 127.
env:
  PATH: /opt/local/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  portfiles:
    name: Portfiles and patch
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Require Intel
        run: |
          arch="$(uname -m)"
          echo "runner arch: $arch"
          [ "$arch" = "x86_64" ] || { echo "::error::this repository is Intel-only"; exit 1; }

      # Composite action: resolves the release, restores the cached base or installs
      # it, then saves the base-only tarball before anything else is added.
      - name: Install MacPorts base (cached)
        uses: ./.github/actions/macports-base

      - name: Register the overlay ahead of macports-ports
        run: |
          set -euo pipefail
          sudo port -q sync
          # MacPorts resolves a duplicate port name to the FIRST source listed in
          # sources.conf - that file's own header says so. Appending a file:// entry
          # (what the MacPorts guide shows for a throwaway local test) therefore never
          # shadows macports-ports, which is exactly how this job failed once.
          # [nosync] stops 'port sync' from git-pulling this checkout.
          entry="file://$GITHUB_WORKSPACE/ports [nosync]"
          sources=/opt/local/etc/macports/sources.conf
          tmp="$(mktemp)"
          {
            printf '%s\n' "$entry"
            grep -vF "file://$GITHUB_WORKSPACE/ports" "$sources" || true
          } > "$tmp"
          sudo tee "$sources" < "$tmp" >/dev/null
          echo "--- sources.conf ---"
          grep -nE '^file://|\[default\]' "$sources"
          portindex -f ports
          port -q info --fullname vulkan-tools

      - name: The overridden ports resolve to this overlay
        run: |
          set -euo pipefail
          # Output formats, learned the hard way:
          #   port -q info --revision vulkan-tools   ->  "1"            (bare value)
          #   port      info --revision vulkan-tools ->  "revision: 1"  (labelled)
          # so parsing "field 2" of the quiet form yields an empty string and the check
          # fails even when the overlay is winning. Compare the bare value instead, and
          # use --portdir for the real question: which repository supplied the Portfile.
          # Output formats, each of which bit this workflow once:
          #   port -q info --revision vulkan-tools   ->  "1"                     (bare value)
          #   port      info --revision vulkan-tools ->  "revision: 1"
          #   port -q info --portdir vulkan-tools    ->  "graphics/vulkan-tools" (relative)
          #   port -q info --line --name --version --revision vulkan-tools
          #                                          ->  "vulkan-tools<TAB>1.4.363.0<TAB>1"
          # So --portdir cannot say which repository won (it is relative to the source),
          # and the quiet --revision has no second field to parse. The revision is what
          # proves precedence: macports-ports ships revision 0 for all three ports.
          status=0
          for portname in vulkan-tools vulkan-validationlayers vulkan-utility-libraries; do
            line="$(port -q info --line --name --version --revision "$portname")"
            revision="$(printf '%s\n' "$line" | awk '{print $3}')"
            echo "$portname: '$line' (portdir $(port -q info --portdir "$portname"))"
            if [ "$revision" = "1" ]; then
              echo "OK    $portname revision 1, supplied by this overlay"
            else
              echo "::error::$portname has revision '$revision', expected 1: macports-ports is winning over the overlay"
              status=1
            fi
          done
          exit "$status"

      - name: Patch applies to the pinned tarball
        run: |
          set -euo pipefail
          sudo port -q extract vulkan-tools
          # Locate the source root by its vulkaninfo directory rather than assuming the
          # archive's top-level name (the tag is vulkan-sdk-1.4.363.0, the distfile is
          # Vulkan-Tools-1.4.363.0).
          src="$(find /opt/local/var/macports/build -maxdepth 5 -type d -name vulkaninfo \
                    -path '*vulkan-tools*' 2>/dev/null | head -1)"
          [ -n "$src" ] || { echo "::error::extracted Vulkan-Tools source not found"; exit 1; }
          src="$(dirname "$src")"
          echo "source root: $src"
          patch -p1 --dry-run --directory "$src" \
            --input "$GITHUB_WORKSPACE/ports/graphics/vulkan-tools/files/patch-vulkaninfo-layered-api-sType.diff"

  install:
    name: Build ports from source and test
    needs: portfiles
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - name: Require Intel
        run: |
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::this repository is Intel-only"; exit 1; }

      - name: Install MacPorts base (cached)
        uses: ./.github/actions/macports-base

      - name: Register the overlay ahead of macports-ports
        run: |
          set -euo pipefail
          sudo port -q sync
          # First source wins for a duplicate port name; see the note in the other job.
          entry="file://$GITHUB_WORKSPACE/ports [nosync]"
          sources=/opt/local/etc/macports/sources.conf
          tmp="$(mktemp)"
          {
            printf '%s\n' "$entry"
            grep -vF "file://$GITHUB_WORKSPACE/ports" "$sources" || true
          } > "$tmp"
          sudo tee "$sources" < "$tmp" >/dev/null
          grep -nE '^file://|\[default\]' "$sources"
          portindex -f ports

      - name: Install the overlaid ports
        run: |
          set -euo pipefail
          # No -s: the three overlay ports are revision 1, and no binary archive exists
          # for that revision, so MacPorts builds exactly those from source anyway.
          # Forcing source for every dependency would also rebuild python314, cmake,
          # glslang, spirv-tools... and blow the job timeout.
          sudo port -N -v install vulkan-tools vulkan-validationlayers MoltenVK
          # 'port -q installed' indents its lines, so anchor on whitespace, not on ^name.
          port -q installed | grep -E '^[[:space:]]*(vulkan-(tools|validationlayers|utility-libraries)|MoltenVK)[[:space:]]'

      - name: Test the installed stack
        run: |
          set -euo pipefail
          ./tests/run_tests.sh

      - name: Upload MacPorts logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macports-logs
          path: /opt/local/var/macports/logs
          retention-days: 7
          if-no-files-found: ignore
